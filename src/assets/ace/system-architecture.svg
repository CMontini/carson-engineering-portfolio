<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ACE automated court cleaning robot architecture</title>
  <desc id="desc">Top-down technical illustration showing the circular chassis, drive wheels, controller, battery, reservoir, misting bar, and rotating cleaning pad.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111b2b"/>
      <stop offset="1" stop-color="#24364f"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f2e8"/>
      <stop offset="1" stop-color="#d9e3ea"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g opacity=".15" stroke="#9fb3c8" stroke-width="1">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200M0 700H1200"/>
    <path d="M100 0V800M200 0V800M300 0V800M400 0V800M500 0V800M600 0V800M700 0V800M800 0V800M900 0V800M1000 0V800M1100 0V800"/>
  </g>
  <text x="70" y="82" fill="#e9eef4" font-family="Arial, sans-serif" font-size="24" letter-spacing="5">ACE · SYSTEM ARCHITECTURE</text>
  <text x="70" y="116" fill="#8fa6bc" font-family="Arial, sans-serif" font-size="16">AUTOMATED COURT ENHANCER · TOP VIEW</text>

  <g transform="translate(550 410)" filter="url(#shadow)">
    <circle r="255" fill="url(#body)" stroke="#ffffff" stroke-width="8"/>
    <circle r="226" fill="none" stroke="#6f879d" stroke-width="3" stroke-dasharray="10 12"/>
    <rect x="-292" y="-92" width="62" height="184" rx="26" fill="#172436" stroke="#8fb5d1" stroke-width="4"/>
    <rect x="230" y="-92" width="62" height="184" rx="26" fill="#172436" stroke="#8fb5d1" stroke-width="4"/>
    <path d="M-276-56h30M-276-20h30M-276 16h30M-276 52h30M246-56h30M246-20h30M246 16h30M246 52h30" stroke="#d7e2eb" stroke-width="7"/>
    <rect x="-98" y="-156" width="196" height="98" rx="18" fill="#cbe7f1" stroke="#28465f" stroke-width="4"/>
    <text x="0" y="-116" text-anchor="middle" fill="#1d3347" font-family="Arial, sans-serif" font-weight="700" font-size="18">WATER RESERVOIR</text>
    <text x="0" y="-88" text-anchor="middle" fill="#49667c" font-family="Arial, sans-serif" font-size="14">PUMP + MISTING</text>
    <rect x="-160" y="-28" width="132" height="88" rx="14" fill="#e9bf67" stroke="#5b4522" stroke-width="4"/>
    <text x="-94" y="7" text-anchor="middle" fill="#342914" font-family="Arial, sans-serif" font-weight="700" font-size="17">12.8 V</text>
    <text x="-94" y="33" text-anchor="middle" fill="#5b4522" font-family="Arial, sans-serif" font-size="14">BATTERY</text>
    <rect x="28" y="-28" width="132" height="88" rx="14" fill="#9fc9e8" stroke="#28465f" stroke-width="4"/>
    <text x="94" y="7" text-anchor="middle" fill="#183247" font-family="Arial, sans-serif" font-weight="700" font-size="16">ARDUINO</text>
    <text x="94" y="33" text-anchor="middle" fill="#355c75" font-family="Arial, sans-serif" font-size="14">MEGA + H-BRIDGE</text>
    <circle cy="142" r="88" fill="#6ca5a2" stroke="#244d4b" stroke-width="5"/>
    <circle cy="142" r="60" fill="none" stroke="#d9f1ee" stroke-width="4" stroke-dasharray="8 10"/>
    <path d="M0 88v108M-54 142H54" stroke="#d9f1ee" stroke-width="4"/>
    <text x="0" y="136" text-anchor="middle" fill="#122f2e" font-family="Arial, sans-serif" font-weight="700" font-size="15">ROTATING</text>
    <text x="0" y="158" text-anchor="middle" fill="#122f2e" font-family="Arial, sans-serif" font-weight="700" font-size="15">CLEANING PAD</text>
    <path d="M-126-196H126" stroke="#4f91c6" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-100" cy="-212" r="6" fill="#8ddcf2"/>
    <circle cx="-50" cy="-212" r="6" fill="#8ddcf2"/>
    <circle cy="-212" r="6" fill="#8ddcf2"/>
    <circle cx="50" cy="-212" r="6" fill="#8ddcf2"/>
    <circle cx="100" cy="-212" r="6" fill="#8ddcf2"/>
  </g>

  <g fill="none" stroke="#8fb5d1" stroke-width="3">
    <path d="M280 266H120L82 228"/>
    <path d="M322 516H132L82 558"/>
    <path d="M822 300h190l48-42"/>
    <path d="M790 552h220l50 42"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="72" y="198" fill="#e9eef4" font-size="18" font-weight="700">DIFFERENTIAL DRIVE</text>
    <text x="72" y="224" fill="#91a8bd" font-size="14">Two independent DC wheel motors</text>
    <text x="72" y="532" fill="#e9eef4" font-size="18" font-weight="700">COMPACT CHASSIS</text>
    <text x="72" y="558" fill="#91a8bd" font-size="14">Approx. 12-inch circular envelope</text>
    <text x="858" y="224" fill="#e9eef4" font-size="18" font-weight="700">CONTROLLED MISTING</text>
    <text x="858" y="250" fill="#91a8bd" font-size="14">Fluid applied ahead of cleaning pad</text>
    <text x="858" y="574" fill="#e9eef4" font-size="18" font-weight="700">INTEGRATED POWER</text>
    <text x="858" y="600" fill="#91a8bd" font-size="14">Motor supply + regulated logic rail</text>
  </g>
  <g transform="translate(70 724)" font-family="Arial, sans-serif">
    <rect width="1060" height="1" fill="#5d748a"/>
    <text y="38" fill="#8fa6bc" font-size="14" letter-spacing="2">MOBILITY</text>
    <text x="230" y="38" fill="#8fa6bc" font-size="14" letter-spacing="2">FLUID DELIVERY</text>
    <text x="520" y="38" fill="#8fa6bc" font-size="14" letter-spacing="2">CLEANING ACTION</text>
    <text x="820" y="38" fill="#8fa6bc" font-size="14" letter-spacing="2">CONTROL + POWER</text>
  </g>
</svg>
